name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l cmd internal)"
      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race -shuffle=on -count=1 ./...
      - name: Build
        run: go build -trimpath ./cmd/godex
      - name: Source size
        run: ./scripts/check-source-size.sh
      - name: TUI framework guard
        run: ./scripts/check-tui-framework.sh
      - name: Shell syntax
        run: sh -n install.sh
      - name: Installer smoke
        run: ./scripts/test-installers.sh
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }

  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -shuffle=on -count=1 ./...
      - name: Build
        run: go build -trimpath ./cmd/godex
      - name: PowerShell installer parser
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }
      - name: PowerShell installer smoke
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $env:GODEX_VERSION = "invalid tag"
          try {
            & ./install.ps1
            throw "invalid release tag was accepted"
          } catch {
            if ($_.Exception.Message -notmatch "release tag is invalid") { throw }
          }

  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
