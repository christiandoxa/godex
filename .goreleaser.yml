version: 2

project_name: godex

before:
  hooks:
    - go mod tidy

builds:
  - id: godex
    main: ./cmd/godex
    binary: godex
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/christiandoxa/godex/internal/version.Version={{ .Version }}
      - -X github.com/christiandoxa/godex/internal/version.Commit={{ .Commit }}
      - -X github.com/christiandoxa/godex/internal/version.Date={{ .Date }}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

release:
  extra_files:
    - glob: install.sh
    - glob: install.ps1

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
